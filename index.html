<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0d12">
<title>Roam</title>
<style>
:root{
  --bg:#f2f2f7; --card:#ffffff; --text:#1c1c1e; --muted:#8e8e93;
  --green:#34c759; --amber:#ff9500; --red:#ff3b30; --blue:#007aff;
  --seg:#e3e3e8; --press:rgba(0,0,0,.06);
  color-scheme:light;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;}
#app{max-width:520px; margin:0 auto; padding:8px 16px 48px;}
/* iOS large-title header */
.topbar{display:flex; align-items:flex-end; gap:8px; margin:8px 2px 14px;}
.app-title{font-size:32px; font-weight:800; letter-spacing:-.02em; flex:1; line-height:1.15;}
.icon-btn{background:transparent; border:none; border-radius:50%;
  width:40px; height:40px; font-size:21px; cursor:pointer; color:var(--blue);
  display:flex; align-items:center; justify-content:center;}
.icon-btn:active{background:var(--press); transform:scale(.92);}
@keyframes spin360{to{transform:rotate(360deg);}}
.icon-btn.spinning{animation:spin360 .7s linear infinite;}
.mini-btn{transition:transform .1s ease, opacity .1s ease;}
.mini-btn:active{transform:scale(.93);}
button{ -webkit-tap-highlight-color:transparent; }
/* iOS grouped cards */
.tier{background:var(--card); border:none; border-radius:20px; padding:16px; margin-bottom:14px;
  box-shadow:0 1px 4px rgba(0,0,0,.06);}
.tier h2{font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted);
  margin:0 0 10px; font-weight:600;}
.row{display:flex; align-items:center; justify-content:space-between; gap:8px;}
/* weather */
.tier-wxstrip{padding:10px 16px;}
.wx-strip{font-size:14px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-variant-numeric:tabular-nums;}
.wx-strip .wx-icon{font-size:18px; margin-right:6px;}
.wx-strip{cursor:pointer;}
.wx-abadge{color:#B7791F; font-weight:600;}
.chev-wx{color:#8E8E93; font-size:16px;}
.wx-detail{font-size:13px; margin-top:6px;}
.wx-alert{margin-top:8px; padding-top:8px; border-top:1px solid rgba(0,0,0,0.08);}
.wx-ahead{margin-top:2px;}
.wx-adesc{color:var(--muted); margin-top:4px; white-space:pre-wrap; line-height:1.4;}
.wx-strip b{font-weight:700;}
.leave-line{font-size:16px; font-weight:600; margin:10px 0 4px; font-variant-numeric:tabular-nums;}
.mini-btn{background:#007AFF; color:#fff; border:none; border-radius:12px; padding:4px 12px; font-size:13px; font-weight:600; margin-left:8px; cursor:pointer;}
.mini-btn:active{opacity:0.7;}

/* iOS segmented control */
.seg{display:flex; background:var(--seg); border-radius:12px; padding:2px; margin-bottom:12px;}
.seg-btn{flex:1; border:none; background:transparent; border-radius:10px; padding:6px 0;
  font-size:13px; font-weight:500; color:var(--text); cursor:pointer;}
.seg-btn.sel{background:#fff; font-weight:600; box-shadow:0 1px 3px rgba(0,0,0,.12);}
.seg-btn{transition:transform .1s ease, opacity .1s ease;}
.seg-btn:active{transform:scale(.94); opacity:.75;}
/* line badges */
.badge{display:inline-flex; align-items:center; justify-content:center; min-width:32px; height:32px;
  border-radius:10px; font-weight:700; font-size:17px; color:#fff; padding:0 9px; margin-right:10px;
  box-shadow:0 1px 2px rgba(0,0,0,.12);}
.dot{width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:2px; flex:none;}
.leg-head .dot{width:11px; height:11px; margin:0 10px 0 2px;}
.dot.green{background:var(--green);} .dot.amber{background:var(--amber);}
.dot.red{background:var(--red);} .dot.blue{background:var(--blue);} .dot.gray{background:#c7c7cc;}
/* route legs */
.leg{border:none; border-radius:16px; padding:13px 14px; margin:10px 0; background:var(--bg);
  transition:transform .12s ease, opacity .12s ease;}
.leg:active{transform:scale(.985); opacity:.82;}
.leg-head .chev{transition:transform .22s ease; display:inline-block;}
.leg-head .chev.open{transform:rotate(90deg);}
.leg-head{display:flex; align-items:center; font-weight:700; font-size:17px; letter-spacing:-.01em;}
.leg-sub{color:var(--muted); font-size:13px; margin-top:5px;}
.leg-time{font-size:17px; margin-top:8px; font-variant-numeric:tabular-nums;}
.leg-head .chev{margin-left:auto; color:#8E8E93; font-size:18px; font-weight:400;}
.tt{margin-top:8px; padding-top:4px; border-top:1px solid rgba(0,0,0,0.08);}
.tt-row{display:flex; justify-content:space-between; align-items:center; padding:4px 0; font-size:14px; font-variant-numeric:tabular-nums;}
.tt-prev{color:#8E8E93;}
.tt-cur{font-weight:700;}
.tt-tag{color:#8E8E93; font-size:13px;}
.tt-cur .tt-tag{color:#007AFF;}
.planned{background:#FFF9E6; border-radius:14px; padding:12px 14px; margin:10px 0;}
.planned-head{display:flex; align-items:center; gap:6px; font-weight:700; font-size:15px;}
.planned-item{margin-top:8px; padding-top:8px; border-top:1px solid rgba(0,0,0,0.08); cursor:pointer;}
.planned-title{font-size:14px; margin-top:4px; line-height:1.35;}
.planned-when{color:#8E8E93; font-size:13px; margin-top:2px;}
.planned-desc{font-size:13px; color:#3A3A3C; margin-top:6px; line-height:1.4; display:none;}
.leg-time b{font-size:17px; font-weight:700; letter-spacing:-.01em; font-variant-numeric:tabular-nums;}
.transfer{background:var(--bg);}
.alert-text{font-size:13px; color:var(--muted); margin-top:8px; line-height:1.5;}
button{font:inherit;}
.btn{background:var(--seg); color:var(--text); border:none; border-radius:12px;
  padding:10px 14px; font-weight:600; cursor:pointer;}
.btn:active{background:#d8d8de;}
.btn.primary{background:var(--blue); color:#fff;}
.btn.primary:active{background:#0062cc;}
.btn.block{width:100%; margin-top:12px;}
.updated{color:var(--muted); font-size:12px; text-align:center; margin-top:8px;}
.alt{border:none; border-radius:16px; padding:13px 14px; margin:10px 0; background:var(--bg); cursor:pointer;}
.alt:active{background:#e8e8ed;}
.alt b{font-size:15px;}
.allclear{color:var(--green); font-weight:600;}
/* settings sheet */
#sheet{position:fixed; inset:0; background:rgba(0,0,0,.4); display:none; z-index:50;
  align-items:flex-end; justify-content:center;}
#sheet.open{display:flex;}
#sheet-card{background:var(--bg); width:100%; max-width:520px; max-height:92vh; overflow-y:auto; -webkit-overflow-scrolling:touch;
  border-radius:20px 20px 0 0; padding:18px 18px 34px;}
#sheet-card h2{margin:0 0 4px; font-size:22px; font-weight:700; letter-spacing:-.02em;}
.f-label{font-size:13px; color:var(--muted); margin:16px 0 6px; font-weight:600; text-transform:uppercase; letter-spacing:.04em;}
.f-hint{text-transform:none; letter-spacing:0; font-weight:400;}
.f-input{width:100%; background:#fff; color:var(--text); border:none;
  border-radius:12px; padding:12px 14px; font-size:16px; box-shadow:0 1px 2px rgba(0,0,0,.04);}
.f-input:focus{outline:2px solid var(--blue); outline-offset:-2px;}
.picker{position:relative;}
.picker-list{position:absolute; top:100%; left:0; right:0; background:#fff; border:none;
  border-radius:14px; margin-top:6px; max-height:250px; overflow-y:auto; z-index:60; display:none;
  box-shadow:0 8px 30px rgba(0,0,0,.14);}
.picker-list.open{display:block;}
.picker-item{padding:11px 14px; border-bottom:1px solid #f2f2f7; cursor:pointer; font-size:15px;}
.picker-item:last-child{border-bottom:none;}
.picker-item:active{background:var(--bg);}
.picker-item .badge{min-width:26px; height:26px; font-size:14px; margin-right:8px; border-radius:8px;}
.pick-wrap{position:relative;}
.pick-list{position:absolute; top:100%; left:0; right:0; background:#fff; border:none;
  border-radius:14px; margin-top:6px; max-height:250px; overflow-y:auto; z-index:60;
  box-shadow:0 8px 30px rgba(0,0,0,.14);}
.pick-item{padding:11px 14px; border-bottom:1px solid #f2f2f7; cursor:pointer; font-size:15px;}
.pick-item:last-child{border-bottom:none;}
.pick-line{color:var(--muted); font-size:12px;}
.linechips{margin-top:8px; display:flex; gap:8px; flex-wrap:wrap;}
.chip{background:#fff; border:none; color:var(--blue); border-radius:999px;
  padding:7px 14px; font-size:14px; font-weight:600; cursor:pointer; box-shadow:0 1px 2px rgba(0,0,0,.06);}
.chip.sel{background:var(--blue); color:#fff;}
.picked{font-size:13px; color:var(--muted); margin-top:4px;}
.legedit{background:#fff; border-radius:16px; padding:4px 14px 14px; margin-top:10px;
  box-shadow:0 1px 2px rgba(0,0,0,.04);}
.err{background:#fdecea; color:#b3261e; border-radius:14px; padding:12px 14px; margin-bottom:12px; font-size:14px;}
.small{font-size:12px; color:var(--muted);}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="app-title">Roam</div>
    <button class="icon-btn" id="refresh-btn" aria-label="Refresh">&#10227;</button>
    <button class="icon-btn" id="settings-btn" aria-label="Settings">&#9776;</button>
  </div>
  <div id="err" class="err" style="display:none"></div>

  <section class="tier tier-wxstrip" id="tier-weather">
    <div class="wx-strip" id="wx-strip">&ndash;</div>
  </section>

  <div id="planned" style="display:none"></div>

  <section class="tier" id="tier-route">
    <h2 id="h-route">Your route</h2>
    <div class="seg" id="dest-toggle"><button class="seg-btn sel" data-dest="0"></button><button class="seg-btn" data-dest="1"></button><button class="seg-btn" data-dest="2">\uD83D\uDD0D</button></div>
    <div class="seg" id="dir-toggle2" style="margin-top:8px"><button class="seg-btn sel" data-dir="outbound">To Dest</button><button class="seg-btn" data-dir="inbound">To Home</button></div>
    <div id="search-bar" style="display:none; margin-top:10px">
      <div class="pick-wrap">
        <input class="f-input" id="dest-search" placeholder="Search destination..." autocomplete="off">
        <div class="pick-list" id="dest-search-ac"></div>
      </div>
    </div>
    <div id="legs" style="margin-top:4px"></div>
  </section>

  <section class="tier" id="tier-alt">
    <h2 id="h-alt">Alternatives</h2>
    <div id="alts"></div>
  </section>

  <div class="updated" id="updated"></div>
</div>

<div id="sheet">
  <div id="sheet-card">
    <div class="row">
      <h2 id="set-title">Commute settings</h2>
      <button class="btn" id="sheet-close">Done</button>
    </div>
    <div class="f-label" id="lbl-home">Home address</div>
    <div class="pick-wrap">
      <input class="f-input" id="set-home" placeholder="e.g. 123 Main St, Brooklyn NY 11238" autocomplete="off">
      <div class="pick-list" id="home-ac"></div>
    </div>
    <div class="f-label" id="lbl-dest">Destinations</div>
    <div class="small" id="lbl-dest-hint" style="margin-bottom:8px">Three places you go often. Routes are found automatically.</div>
    <div id="dest-list"></div>
    <button class="btn primary block" id="set-save">Save</button>
    <div class="small" style="margin-top:8px" id="lbl-note">Addresses are geocoded once and stored on this device only.</div>
  </div>
</div>

/* ===== state ===== */
const LS_KEY = "roam_v1";
let S = loadSettings();
function loadSettings(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      const p = JSON.parse(raw);
      const d = JSON.parse(JSON.stringify(DEFAULTS));
      for(const k of Object.keys(d)){ if(p[k]!==undefined) d[k]=p[k]; }
      if(!Array.isArray(d.dests)||d.dests.length!==3){
        d.dests=JSON.parse(JSON.stringify(DEFAULTS.dests));
      }
      if(typeof d.destIndex!=="number"||d.destIndex<0||d.destIndex>2) d.destIndex=0;
      d.lang="en";
      return d;
    }
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULTS));
}
function saveSettings(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }

const ST_BY_ID = {};
STATIONS.forEach(s=>{ ST_BY_ID[s.id]=s; });

/* ===== utils ===== */
const $ = id=>document.getElementById(id);
const num = v=>v==null?0:Number(v);
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function fmtClockShort(sec){ return fmtClock(sec).replace(/\s?[AP]M$/i,""); }
function fmtClock(sec){ const d=new Date(sec*1000); const l=(typeof S!=="undefined"&&S.lang)||"en"; if(l==="ko"||l==="zh"||l==="ja"||l==="fr"){ return d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit",timeZone:TZ}); } return d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit",timeZone:TZ}); }
function fmtHM(){ return new Date().toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit",second:"2-digit",timeZone:TZ}); }
function tempBoth(f){ return Math.round(f)+"°F ("+Math.round((f-32)*5/9)+"°C)"; }
function havKm(a,b,c,d){
  const R=6371, t=Math.PI/180;
  const h=Math.sin((c-a)*t/2)**2 + Math.cos(a*t)*Math.cos(c*t)*Math.sin((d-b)*t/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function lineBadge(line){
  const col=LINE_COLORS[line]||"#666";
  const dark=(line==="N"||line==="Q"||line==="R"||line==="W"||line==="L");
  return '<span class="badge" style="background:'+col+';color:'+(dark?"#111":"#fff")+'">'+esc(line)+'</span>';
}
function stationName(id){ const s=ST_BY_ID[id]; return s?s.name:id; }
function stopSet(stationId){
  const set=new Set();
  if(!ST_BY_ID[stationId]) return set;
  set.add(stationId);
  set.add(stationId+"N"); set.add(stationId+"S");
  set.add(stationId);
  return set;
}
function showErr(msg){ const e=$("err"); e.style.display=msg?"block":"none"; e.textContent=msg||""; }

const GEO_KEY="brooklyn_commute_geo_v1";
function geoGet(k){
  try{ const c=JSON.parse(localStorage.getItem(GEO_KEY)||"{}"); return c[k]||null; }catch(e){ return null; }
}
function geoPut(k,v){
  try{ const c=JSON.parse(localStorage.getItem(GEO_KEY)||"{}"); c[k]=v; localStorage.setItem(GEO_KEY,JSON.stringify(c)); }catch(e){}
}
async function geocode(label){
  const key=label.trim().toLowerCase();
  if(!key) return null;
  const hit=geoGet(key);
  if(hit) return hit;
  const url="https://nominatim.openstreetmap.org/search?format=json&limit=1&q="+encodeURIComponent(label);
  const r=await fetch(url,{headers:{"Accept":"application/json"}});
  const j=await r.json();
  if(j&&j[0]){
    const v={lat:parseFloat(j[0].lat), lon:parseFloat(j[0].lon)};
    geoPut(key,v);
    return v;
  }
  return null;
}

/* ===== walk time (OSRM foot, haversine fallback) ===== */
async function walkMinutes(aLat,aLon,bLat,bLon){
  if(aLat==null||aLon==null||bLat==null||bLon==null) return null;
  try{
    const u="https://router.project-osrm.org/route/v1/foot/"+aLon+","+aLat+";"+bLon+","+bLat+"?overview=false";
    const r=await fetch(u);
    const j=await r.json();
    // NOTE: the public OSRM demo server sometimes returns car-like durations
    // for the foot profile, so derive walk time from route distance instead.
    if(j.routes&&j.routes[0]&&j.routes[0].distance) return (j.routes[0].distance/1000)/4.0*60;
  }catch(e){}
  return havKm(aLat,aLon,bLat,bLon)*1.3/4.0*60;
}

/* ===== MTA service status (alerts JSON) ===== */
let lineStatus={}, stationNotes=[], plannedRaw=[];
async function fetchStatus(){
  const r=await fetch(ALERTS_URL);
  const j=await r.json();
  const now=Math.floor(Date.now()/1000);
  lineStatus={}; stationNotes=[]; plannedRaw=[];
  const items=[];
  for(const e of (j.entity||[])){
    const a=e.alert||{};
    let active=false;
    for(const ap of (a.active_period||[])){
      const s=num(ap.start), en=num(ap.end)||1e15;
      if(s<=now&&now<=en){ active=true; break; }
    }
    if(!active){
      // future planned notice: take the soonest upcoming period
      let ns=null;
      for(const ap of (a.active_period||[])){
        const s=num(ap.start);
        if(s>now&&(ns==null||s<ns)) ns=s;
      }
      if(ns!=null&&ns<=now+7*86400){
        let en=null;
        for(const ap of (a.active_period||[])){ if(num(ap.start)===ns){ en=num(ap.end)||null; break; } }
        const mtype=((a["transit_realtime.mercury_alert"])||{}).alert_type||"";
        const lines=[];
        for(const ie of (a.informed_entity||[])){
          if(ie.route_id&&!ie.stop_id&&lines.indexOf(ie.route_id)<0) lines.push(ie.route_id);
        }
        if(lines.length){
          const ht=((a.header_text||{}).translation||[]).find(t=>t.language==="en");
          const dt=((a.description_text||{}).translation||[]).find(t=>t.language==="en");
          plannedRaw.push({lines:lines,title:ht?ht.text:"Service change",desc:dt?dt.text:"",
            start:ns,end:en,cls:SEV_CLASS[mtype]||"blue"});
        }
      }
      continue;
    }
    items.push(a);
  }
  for(const a of items){
    const mtype=((a["transit_realtime.mercury_alert"])||{}).alert_type||"";
    const cls=SEV_CLASS[mtype]||"blue";
    const tr=((a.header_text||{}).translation||[]).find(t=>t.language==="en");
    const title=tr?tr.text:"Service change";
    for(const ie of (a.informed_entity||[])){
      if(ie.route_id&&!ie.stop_id){
        const cur=lineStatus[ie.route_id];
        if(!cur||SEV_RANK[cls]>SEV_RANK[cur.cls]) lineStatus[ie.route_id]={cls:cls,text:title};
      }
    }
  }
  const myStops=new Set();
  ["s1","s2","s3","s4"].forEach(k=>{ stopSet(S[k].stationId).forEach(x=>myStops.add(x)); });
  for(const a of items){
    const tr=((a.header_text||{}).translation||[]).find(t=>t.language==="en");
    const title=tr?tr.text:"Service change";
    for(const ie of (a.informed_entity||[])){
      if(ie.stop_id){
        const sid=String(ie.stop_id).replace(/[NS]$/,"");
        if(myStops.has(sid)||myStops.has(ie.stop_id)){ stationNotes.push(title); break; }
      }
    }
  }
}
function statusOf(line){
  return lineStatus[line]||{cls:"green",text:""};
}


/* ===== MTA arrivals (GTFS-RT protobuf, zero-dependency decoder) =====
   Minimal wire-format reader for the fields this app needs:
   FeedMessage{2:entity[]} > FeedEntity{3:trip_update}   > TripUpdate{1:trip{TripDescriptor{5:route_id}}, 2:stop_time_update[]}
   > StopTimeUpdate{4:stop_id, 2:arrival{StopTimeEvent{2:time}}} */
const TD8=new TextDecoder();
function pv(buf,pos){let v=0,m=1,b;do{b=buf[pos++];v+=(b&0x7F)*m;m*=128;}while(b&0x80);return [v,pos];}
function pm(buf,start,end){
  const f={};let pos=start;
  while(pos<end){
    let k;[k,pos]=pv(buf,pos);
    const n=k>>>3,w=k&7,arr=(f[n]||(f[n]=[]));
    if(w===0){let v;[v,pos]=pv(buf,pos);arr.push(v);}
    else if(w===2){let l;[l,pos]=pv(buf,pos);arr.push(buf.subarray(pos,pos+l));pos+=l;}
    else if(w===5){arr.push(0);pos+=4;}
    else if(w===1){arr.push(0);pos+=8;}
    else throw new Error("proto wire "+w);
  }
  return f;
}
const bs2s=b=>(b instanceof Uint8Array)?TD8.decode(b):"";
function decodeFeed(u8){
  const top=pm(u8,0,u8.length),out=[];
  for(const eb of (top[2]||[])){
    const e=pm(eb,0,eb.length),tb=(e[3]||[])[0];
    if(!tb)continue;
    const tu=pm(tb,0,tb.length),trb=(tu[1]||[])[0];
    const tr=trb?pm(trb,0,trb.length):{};
    const stops=[];
    for(const sb of (tu[2]||[])){
      const s=pm(sb,0,sb.length),ab=(s[2]||[])[0];
      const ar=ab?pm(ab,0,ab.length):{};
      stops.push({stop_id:bs2s((s[4]||[])[0]),arrival:{time:((ar[2]||[])[0])||0}});
    }
    out.push({trip_update:{trip:{route_id:bs2s((tr[5]||[])[0])},stop_time_update:stops}});
  }
  return out;
}
async function fetchFeed(feedPath){
  const r=await fetch(MTA+feedPath);
  if(!r.ok) throw new Error("feed "+feedPath+" HTTP "+r.status);
  const buf=await r.arrayBuffer();
  return decodeFeed(new Uint8Array(buf));
}
function findTrips(feed,line,fromId,toId,after,strict){
  const from=stopSet(fromId), to=stopSet(toId);
  const out=[];
  const cutoff = strict ? after : after-120;
  for(const e of feed){
    const tu=e.trip_update;
    if(!tu||!tu.trip) continue;
    if((tu.trip.route_id||"")!==line) continue;
    const stus=tu.stop_time_update||[];
    let bi=-1;
    for(let i=0;i<stus.length;i++){
      const raw=stus[i].stop_id||"";
      if(from.has(raw)||from.has(raw.replace(/[NS]$/,""))){ bi=i; break; }
    }
    if(bi<0) continue;
    let ai=-1;
    for(let i=bi+1;i<stus.length;i++){
      const raw=stus[i].stop_id||"";
      if(to.has(raw)||to.has(raw.replace(/[NS]$/,""))){ ai=i; break; }
    }
    if(ai<0) continue;
    const bt=num(stus[bi].arrival&&stus[bi].arrival.time)||num(stus[bi].departure&&stus[bi].departure.time);
    const at=num(stus[ai].arrival&&stus[ai].arrival.time)||num(stus[ai].departure&&stus[ai].departure.time);
    if(!bt||bt<cutoff) continue;
    out.push({bt:bt, at:at||0});
  }
  out.sort((x,y)=>x.bt-y.bt);
  return out;
}

/* ===== route model ===== */
// Auto-route: find best subway route when user hasn't specified legs
// Uses home/work coordinates + station geography. Prefers direct lines,
// otherwise 1 transfer via precomputed close station pairs.
const LINE_STATIONS={};
STATIONS.forEach(s=>{ (s.lines||[]).forEach(l=>{ (LINE_STATIONS[l]=LINE_STATIONS[l]||[]).push(s); }); });
// Precompute transfer pairs: stations on different lines within 600m
const XFER_PAIRS=[];
for(let i=0;i<STATIONS.length;i++){
  for(let j=i+1;j<STATIONS.length;j++){
    const a=STATIONS[i], c=STATIONS[j];
    if(a.lines.some(l=>c.lines.includes(l))) continue;
    const d=havKm(a.lat,a.lon,c.lat,c.lon);
    if(d<=0.6) XFER_PAIRS.push({a:a, b:c, d:d});
  }
}
// Index: line -> transfer pairs involving that line
const LINE_XFER_IDX={};
XFER_PAIRS.forEach(xp=>{
  const add=(s,other)=>{
    (s.lines||[]).forEach(l=>{
      (LINE_XFER_IDX[l]=LINE_XFER_IDX[l]||[]).push({from:s, to:other, d:xp.d});
    });
  };
  add(xp.a, xp.b); add(xp.b, xp.a);
});

function autoLegs(){
  const h=originInfo(), w=destInfo();
  if(h.lat==null||h.lon==null||w.lat==null||w.lon==null) return null;
  if(havKm(h.lat,h.lon,w.lat,w.lon)<0.5) return null;
  const nearH=STATIONS.map(s=>({s:s, d:havKm(h.lat,h.lon,s.lat,s.lon)}))
    .filter(x=>x.d<=1.2).sort((a,b)=>a.d-b.d);
  const nearW=STATIONS.map(s=>({s:s, d:havKm(w.lat,w.lon,s.lat,s.lon)}))
    .filter(x=>x.d<=1.2).sort((a,b)=>a.d-b.d);
  if(!nearH.length||!nearW.length) return null;
  const WALK=12, RIDE=2, XFER_PEN=5;
  let best=null;
  const consider=(score, legs)=>{ if(!best||score<best.score) best={score:score, legs:legs}; };
  for(const hn of nearH){
    for(const wn of nearW){
      const H=hn.s, W=wn.s;
      if(H.id===W.id) continue;
      const shared=(H.lines||[]).filter(l=>(W.lines||[]).includes(l));
      for(const line of shared){
        const rideKm=havKm(H.lat,H.lon,W.lat,W.lon);
        consider(hn.d*WALK + rideKm*RIDE + wn.d*WALK,
          [{line:line, from:H.id, to:W.id, kind:"ride", auto:true}]);
      }
      for(const lh of (H.lines||[])){
        for(const lw of (W.lines||[])){
          if(lh===lw) continue;
          for(const xp of XFER_PAIRS){
            let s1=null, s2=null;
            if(xp.a.lines.includes(lh)&&xp.b.lines.includes(lw)){ s1=xp.a; s2=xp.b; }
            else if(xp.b.lines.includes(lh)&&xp.a.lines.includes(lw)){ s1=xp.b; s2=xp.a; }
            else continue;
            const d1=havKm(H.lat,H.lon,s1.lat,s1.lon);
            const d2=havKm(s2.lat,s2.lon,W.lat,W.lon);
            const direct=havKm(H.lat,H.lon,W.lat,W.lon);
            if(d1+d2>direct*2.5+2) continue;
            // s1 must be different from H unless H is the transfer itself
            consider(hn.d*WALK + d1*RIDE + xp.d*WALK + XFER_PEN + d2*RIDE + wn.d*WALK,
              [{line:lh, from:H.id, to:s1.id, kind:"ride", auto:true},
               {line:lw, from:s2.id, to:W.id, kind:"ride", auto:true}]);
          }
        }
      }
      // 2 transfers: H (lh1) -> s1 -> s2 (lm) -> s3 -> s4 -> W (lw2)
      for(const lh1 of (H.lines||[])){
        for(const lw2 of (W.lines||[])){
          if(lh1===lw2) continue;
          const p1cands=LINE_XFER_IDX[lh1]||[];
          const midLines=[...new Set(p1cands.flatMap(x=>x.to.lines||[]))]
            .filter(lm=>lm!==lh1&&lm!==lw2);
          for(const lm of midLines){
            const p1list=p1cands.filter(x=>(x.to.lines||[]).includes(lm))
              .sort((a,b2)=>havKm(H.lat,H.lon,a.from.lat,a.from.lon)-havKm(H.lat,H.lon,b2.from.lat,b2.from.lon))
              .slice(0,5);
            const p2list=(LINE_XFER_IDX[lm]||[]).filter(x=>(x.to.lines||[]).includes(lw2))
              .sort((a,b2)=>havKm(a.to.lat,a.to.lon,W.lat,W.lon)-havKm(b2.to.lat,b2.to.lon,W.lat,W.lon))
              .slice(0,5);
            for(const p1 of p1list){
              for(const p2 of p2list){
                const s1=p1.from, s2=p1.to, s3=p2.from, s4=p2.to;
                const d1=havKm(H.lat,H.lon,s1.lat,s1.lon);
                const dm=havKm(s2.lat,s2.lon,s3.lat,s3.lon);
                const d2=havKm(s4.lat,s4.lon,W.lat,W.lon);
                const direct=havKm(H.lat,H.lon,W.lat,W.lon);
                if(d1+dm+d2>direct*3+3) continue;
                consider(hn.d*WALK + d1*RIDE + p1.d*WALK + XFER_PEN + dm*RIDE + p2.d*WALK + XFER_PEN + d2*RIDE + wn.d*WALK,
                  [{line:lh1, from:H.id, to:s1.id, kind:"ride", auto:true},
                   {line:lm, from:s2.id, to:s3.id, kind:"ride", auto:true},
                   {line:lw2, from:s4.id, to:W.id, kind:"ride", auto:true}]);
              }
            }
          }
        }
      }
    }
  }
  return best?best.legs:null;
}

function getLegs(){
  if(S.destIndex<2){
    const d=S.dests[S.destIndex]||{};
    const manual=(d.legs||[]).filter(l=>l&&l.line&&l.from&&l.to)
      .map(l=>({line:l.line, from:l.from, to:l.to, kind:"ride"}));
    if(manual.length){
      if(S.dir==="inbound") return manual.slice().reverse().map(l=>({line:l.line, from:l.to, to:l.from, kind:"ride"}));
      return manual;
    }
  }
  const auto=autoLegs();
  return auto||[];
}
function originInfo(){
  return S.dir==="inbound" ? destInfoRaw() : S.home;
}
function destInfoRaw(){
  return (S.dests&&S.dests[S.destIndex])||{};
}
function destInfo(){
  return S.dir==="inbound" ? S.home : destInfoRaw();
}

const feedCache={};
async function fetchFeedCached(path){
  const c=feedCache[path];
  if(c&&Date.now()-c.ts<45000) return c.feed;
  const feed=await fetchFeed(path);
  feedCache[path]={ts:Date.now(), feed:feed};
  return feed;
}
async function fetchFeeds(lines){
  const need=[...new Set(lines.map(l=>FEED_FOR[l]).filter(Boolean))];
  const feeds={};
  await Promise.all(need.map(async f=>{
    try{ feeds[f]=await fetchFeedCached(f); }catch(e){ feeds[f]=null; }
  }));
  return feeds;
}

async function computeRoute(legs, startAfter){
  const feeds=await fetchFeeds(legs.map(l=>l.line));
  const now=Math.floor(Date.now()/1000);
  const out=[];
  let after=(startAfter!=null?startAfter:now-60), strict=(startAfter!=null);
  for(const leg of legs){
    const feed=feeds[FEED_FOR[leg.line]];
    let trips=feed?findTrips(feed,leg.line,leg.from,leg.to,after,strict):[];
    const ts=trips.slice(0,5);
    const t=ts.length?ts[0]:null;
    out.push({leg:leg, trip:t, trips:ts, feedOk:!!feed});
    if(t&&t.at){ after=t.at; strict=true; }
  }
  return out;
}

function hasDisruption(legResults){
  return legResults.some(r=>{ const st=statusOf(r.leg.line); return st.cls==="red"||st.cls==="amber"; });
}

/* Fastest-route recommendations when delayed: evaluate nearby stations x lines,
   compute real ETAs from live departures (direct to destination, or rejoin the
   remaining route), and return the top 2 by arrival time. */
async function findFastRoutes(legResults){
  const o=originInfo();
  if(o.lat==null||o.lon==null) return [];
  const legs=getLegs();
  if(!legs.length) return [];
  const sameNameIds=name=>[...new Set(STATIONS.filter(s=>s.name===name).map(s=>s.id))].slice(0,3);
  const destIds=sameNameIds(stationName(legs[legs.length-1].to));
  const normalSig=legs.map(l=>l.line+":"+l.from+">"+l.to).join("|");
  // rejoin the remaining route only if all of it is running fine
  const tail=legs.slice(1);
  const tailGreen=tail.length>0&&tail.every(l=>statusOf(l.line).cls==="green");
  const rjIds=tailGreen?sameNameIds(stationName(tail[0].from)):[];
  const cands=[];
  for(const s of STATIONS){
    const d=havKm(o.lat,o.lon,s.lat,s.lon);
    if(d>1.8||d<0.05) continue;
    const good=s.lines.filter(l=>statusOf(l).cls==="green");
    if(!good.length) continue;
    cands.push({s:s, d:d, lines:good.slice(0,2)});
  }
  cands.sort((a,b)=>a.d-b.d);
  const short=cands.slice(0,8);
  const allLines=[...new Set(short.flatMap(c=>c.lines).concat(legs.map(l=>l.line)))];
  const feeds=await fetchFeeds(allLines);
  const now=Math.floor(Date.now()/1000);
  const options=[], seen=new Set();
  async function evalLegs(legList, after){
    const res=await computeRoute(legList, after);
    const last=res[res.length-1];
    if(last&&last.trip&&last.trip.at&&res.every(r=>r.trip)) return last.trip.at;
    return null;
  }
  for(const c of short){
    const walkMin=Math.max(1,Math.round(c.d/4.5*60));
    const after=now+walkMin*60;
    for(const line of c.lines){
      if(!feeds[FEED_FOR[line]]) continue;
      // (a) direct to destination (any station with the same name)
      for(const dId of destIds){
        const ll=[{line:line, from:c.s.id, to:dId, kind:"ride"}];
        const sig=ll.map(l=>l.line+":"+l.from+">"+l.to).join("|");
        if(sig===normalSig||seen.has(sig)) continue;
        seen.add(sig);
        const arr=await evalLegs(ll, after);
        if(arr) options.push({legs:ll, walkMin:walkMin, arrivalSec:arr});
      }
      // (b) ride to the rejoin point, then continue the rest of the route
      if(tailGreen){
        for(const rId of rjIds){
          if(rId===c.s.id) continue;
          const tailAdj=tail.map((l,i)=>i===0?{line:l.line,from:rId,to:l.to,kind:"ride"}:l);
          const ll=[{line:line, from:c.s.id, to:rId, kind:"ride"}, ...tailAdj];
          const sig=ll.map(l=>l.line+":"+l.from+">"+l.to).join("|");
          if(sig===normalSig||seen.has(sig)) continue;
          seen.add(sig);
          const arr=await evalLegs(ll, after);
          if(arr) options.push({legs:ll, walkMin:walkMin, arrivalSec:arr});
        }
      }
    }
  }
  // one recommendation per boarding station (keep the earliest), then top 2
  const byStation={};
  for(const op of options){
    const k=op.legs[0].from;
    if(!byStation[k]||op.arrivalSec<byStation[k].arrivalSec) byStation[k]=op;
  }
  const deduped=Object.values(byStation);
  deduped.sort((a,b)=>a.arrivalSec-b.arrivalSec);
  return deduped.slice(0,2);
}


/* ===== render ===== */
function dotCls(cls){ return cls==="green"?"green":cls; }
const wxState={open:false};
function renderWeather(w, alerts){
  alerts=alerts||[];
  try{
    const cur=w.current, daily=w.daily, code=cur.weather_code;
    const strip=$("wx-strip");
    let h='<span class="wx-icon">'+(WMO_ICON[code]||"")+'</span>'+
      '<b>'+tempBoth(cur.temperature_2m)+'</b> '+esc(wmoText(code));
    if(alerts.length){
      h+=' <span class="wx-abadge">⚠️ '+esc(alerts[0].event)+(alerts.length>1?" +"+(alerts.length-1):"")+'</span>';
    }
    h+=' <span class="chev-wx">'+(wxState.open?"⌄":"›")+'</span>';
    strip.innerHTML=h;
    strip.style.cursor="pointer";
    let d=$("wx-detail");
    if(!d){
      d=document.createElement("div");
      d.id="wx-detail";
      d.className="wx-detail";
      strip.parentNode.appendChild(d);
    }
    const hi=Math.round(daily.temperature_2m_max[0])+"°", lo=Math.round(daily.temperature_2m_min[0])+"°";
    const wind=cur.wind_speed_10m!=null?Math.round(cur.wind_speed_10m)+" mph":"—";
    const rain=daily.precipitation_probability_max&&daily.precipitation_probability_max[0]!=null?daily.precipitation_probability_max[0]+"%":"—";
    let dh='<span style="color:var(--muted)">H '+hi+' L '+lo+' · 💨 '+wind+' · 🌧️ '+rain+'</span>';
    for(const al of alerts){
      dh+='<div class="wx-alert"><b>⚠️ '+esc(al.event)+'</b>'
        +(al.headline?'<div class="wx-ahead">'+esc(al.headline)+'</div>':"")
        +(al.desc?'<div class="wx-adesc">'+esc(al.desc.slice(0,400))+'</div>':"")
        +'</div>';
    }

// expandable timetable: previous train + next 2 trains on card tap
const expandedLegs=new Set();
async function legTimetable(leg, dispBt){
  const feeds=await fetchFeeds([leg.line]);
  const feed=feeds[FEED_FOR[leg.line]];
  if(!feed) return null;
  const all=findTrips(feed, leg.line, leg.from, leg.to, dispBt-2400, false);
  let prev=null;
  const next=[];
  for(const tr of all){
    if(tr.bt<dispBt-30) prev=tr;
    else if(tr.bt>dispBt+30&&next.length<3) next.push(tr);
  }
  return {prev:prev, next:next};
}
function ttHtml(dispBt, tt){
  let h="";
  if(tt&&tt.prev){
    h+='<div class="tt-row tt-prev"><span>'+fmtClock(tt.prev.bt)+'</span><span class="tt-tag">'+esc(t("tt_prev"))+'</span></div>';
  }
  h+='<div class="tt-row tt-cur"><span>▶ '+fmtClock(dispBt)+'</span><span class="tt-tag">'+cdHtml(dispBt)+'</span></div>';
  if(tt) for(const tr of tt.next){
    h+='<div class="tt-row"><span>'+fmtClock(tr.bt)+'</span><span class="tt-tag">'+cdHtml(tr.bt)+'</span></div>';
  }
  return h;
}
async function loadTtInto(el, leg, dispBt){

function tap(){ try{ if(navigator.vibrate) navigator.vibrate(10); }catch(e){} }
function toggleTt(key, leg, dispBt, cardEl){
  const el=cardEl.querySelector(".tt");

  if(expandedLegs.has(key)){

function restoreLock(){

  try{
    const raw=localStorage.getItem("roam_lock");

let departOptionsCache=[];

function renderRoute(legResults, walkMin, arrWalkMin, isLocked){
  const box=$("legs");
  box.innerHTML="";
  const walkEmoji="\uD83D\uDEB6";
  if(isLocked&&lockedPlan){
    // Frozen trip: show departed state with unlock option
    const lv=document.createElement("div");
    lv.className="leave-line";
    lv.innerHTML=walkEmoji+" Departed <b>"+fmtClock(lockedPlan.departedAt/1000)+"</b> "
      +'<button id="unlock-btn" class="mini-btn">Unlock</button>';
    box.appendChild(lv);
    const ub=lv.querySelector("#unlock-btn");
    if(ub) ub.onclick=(e)=>{ e.stopPropagation(); tap(); unlockTrip(); };
  }else{
    const mins=(walkMin!=null?Math.round(walkMin):0);
    // Leave-by time follows the selected departure option when available
    let leaveBySec=null;
    if(!isLocked&&departOptionsCache.length>=1){
      leaveBySec=departOptionsCache[departIdx].leaveBy;
    }else{
      const allTrips=legResults[0].trips||(legResults[0].trip?[legResults[0].trip]:[]);
      const nowSec=Date.now()/1000;
      for(const tr of allTrips){
        if(tr.bt-mins*60>=nowSec){ leaveBySec=tr.bt-mins*60; break; }
      }
    }
    // Line 1: departure options toggle (2+ options)
    if(!isLocked&&departOptionsCache.length>=2){
      const seg=document.createElement("div");
      seg.className="seg";
      seg.id="depart-seg";
      seg.style.margin="8px 0 4px";
      departOptionsCache.forEach((opt,i)=>{
        const btn=document.createElement("button");
        btn.className="seg-btn"+(i===departIdx?" sel":"");
        const durMin=(opt.arriveDest!=null)?Math.round((opt.arriveDest-opt.leaveBy)/60):null;
        btn.textContent=fmtClockShort(opt.leaveBy)+"-"+(opt.arriveDest!=null?fmtClockShort(opt.arriveDest):"")+(durMin!=null?" ("+durMin+"min)":"");
        btn.onclick=(e)=>{ e.stopPropagation(); tap(); selectDepartOption(i, walkMin, arrWalkMin); };
        seg.appendChild(btn);
      });
      box.appendChild(seg);
    }
    // Line 2: Leave by + Depart button (AM/PM on the Leave by time)
    const lv=document.createElement("div");
    lv.className="leave-line";
    lv.innerHTML=walkEmoji+(leaveBySec!=null?" Leave by <b>"+fmtClock(leaveBySec)+"</b>":"")
      +' <button id="depart-btn" class="mini-btn">Depart →</button>';
    box.appendChild(lv);
    const db=lv.querySelector("#depart-btn");
    if(db) db.onclick=(e)=>{ e.stopPropagation(); tap(); lockTrip(legResults, walkMin, arrWalkMin); };
  }
  renderLegs(legResults, box);
  // final home/work arrival as its own line after the last card (like leave-by)
  const lastTrip=legResults[legResults.length-1].trip;
  if(lastTrip&&lastTrip.at&&arrWalkMin!=null){
    const av=document.createElement("div");
    av.className="leave-line";
    av.innerHTML=(S.dir==="inbound"?"🏠":"🏢")+" Arrive by <b>"+fmtClock(lastTrip.at+arrWalkMin*60)+"</b>";
    box.appendChild(av);
  }
}

async function nextDepartures(feed, line, stationId, after, n){
  const from=stopSet(stationId);
  const out=[];
  for(const e of feed){
    const tu=e.trip_update;
    if(!tu||!tu.trip) continue;
    if((tu.trip.route_id||"")!==line) continue;
    for(const stu of (tu.stop_time_update||[])){
      const raw=stu.stop_id||"";
      if(from.has(raw)||from.has(raw.replace(/[NS]$/,""))){
        const bt=num(stu.arrival&&stu.arrival.time)||num(stu.departure&&stu.departure.time);
        if(bt&&bt>=after-120) out.push({bt:bt, headsign:tu.trip.trip_headsign||""});
        break;
      }
    }
  }
  out.sort((a,b)=>a.bt-b.bt);
  return out.slice(0, n||5);
}

function nyHour(sec){
  const h=new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",hour:"numeric",hour12:false}).format(new Date(sec*1000));
  return parseInt(h,10)%24;
}
function fmtPlannedWhen(start, end){
  const dayFmt=new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",weekday:"short",month:"numeric",day:"numeric"});
  const nowD=new Date(), sD=new Date(start*1000);
  const tomD=new Date(nowD.getTime()+86400000);
  let day;
  if(dayFmt.format(sD)===dayFmt.format(nowD)) day=t("today");
  else if(dayFmt.format(sD)===dayFmt.format(tomD)) day=t("tomorrow");
  else day=dayFmt.format(sD);
  let when=day+", "+fmtClock(start);
  if(end) when+=" – "+fmtClock(end);
  return when;
}
function renderPlanned(){
  const box=$("planned");
  box.innerHTML=""; box.style.display="none";
  const legs=getLegs();
  if(!legs.length||!plannedRaw.length) return;
  const myLines=new Set(legs.map(l=>l.line));
  const seen=new Set(), items=[];
  const sorted=plannedRaw.slice().sort((a,b)=>a.start-b.start);
  for(const p of sorted){
    if(!p.lines.some(l=>myLines.has(l))) continue;
    // skip deep-overnight-only work (12am-5am): not relevant to commute hours
    if(p.end){
      const sh=nyHour(p.start), eh=nyHour(p.end);
      if(sh<5&&eh<=5&&(p.end-p.start)<12*3600) continue;
    }
    const key=p.lines.slice().sort().join(",")+"|"+p.title;
    if(seen.has(key)) continue;
    seen.add(key);
    items.push(p);
    if(items.length>=3) break;
  }
  if(!items.length) return;
  let h='<div class="planned"><div class="planned-head">⚠️ '+esc(t("planned_work"))+'</div>';
  items.forEach((p,idx)=>{
    const badges=p.lines.filter(l=>myLines.has(l)).map(l=>lineBadge(l)).join("");
    h+='<div class="planned-item" data-pi="'+idx+'">'
      +'<div>'+badges+'</div>'
      +'<div class="planned-title">'+esc(p.title)+'</div>'
      +'<div class="planned-when">'+esc(fmtPlannedWhen(p.start,p.end))+'</div>'
      +(p.desc?'<div class="planned-desc">'+esc(p.desc)+'</div>':"")
      +'</div>';
  });
  h+='</div>';
  box.innerHTML=h;
  box.style.display="block";
  box.querySelectorAll(".planned-item").forEach(el=>{
    el.addEventListener("click", ()=>{
      const d=el.querySelector(".planned-desc");
      if(d) d.style.display=d.style.display==="block"?"none":"block";
    });
  });
}

let loading=false;
async function loadAll(){
  if(loading) return;
  loading=true;
  showErr("");
  updateDestToggle();
  syncDirToggle();
  syncSearchBar();
  try{
    const o=originInfo();
    // Weather loads in parallel — never blocks train data
    if(o.lat!=null&&o.lon!=null){
      Promise.all([fetchWeather(o.lat,o.lon).catch(()=>null), fetchNwsAlerts(o.lat,o.lon).catch(()=>[])])
        .then(([wx,nws])=>{ if(wx) renderWeather(wx,nws); });
    }
    await fetchStatus().catch(()=>{});
    renderPlanned();
    if(viewingAlt){
      await renderAltDetail(viewingAlt);
    }else{
      const legs=getLegs();
      if(!legs.length){
        $("legs").innerHTML='<div class="leg-sub">'+esc(t("no_route"))+'</div>';
        renderAlts([], []);
      }else if(lockedPlan&&lockedPlan.destIndex===S.destIndex){
        // Locked trip: don't recompute, just re-render the frozen plan
        renderRoute(lockedPlan.legResults, lockedPlan.walkMin, lockedPlan.arrWalkMin, true);
        renderAlts([], lockedPlan.legResults);
      }else{
        let legResults=await computeRoute(legs);
        let walkMin=null;
        const dCur=S.dests[S.destIndex]||{};
        if(S.dir==="outbound"){ if(dCur.walkMin!=null) walkMin=dCur.walkMin; }
        else{ if(dCur.walkDestMin!=null) walkMin=dCur.walkDestMin; }
        if(walkMin==null){
          try{
            const bs=ST_BY_ID[legResults[0].leg.from];
            if(bs) walkMin=await walkMinutes(o.lat,o.lon,bs.lat,bs.lon);
          }catch(e){}
        }
        // final walk: last station -> destination (same for all departure options)
        let arrWalkMin=null;
        if(S.dir==="outbound"){ if(dCur.walkDestMin!=null) arrWalkMin=dCur.walkDestMin; }
        else{ if(dCur.walkMin!=null) arrWalkMin=dCur.walkMin; }
        if(arrWalkMin==null){
          try{
            const dest=destInfo();
            const ls=ST_BY_ID[legResults[legResults.length-1].leg.to];
            if(dest.lat!=null&&dest.lon!=null&&ls) arrWalkMin=await walkMinutes(ls.lat,ls.lon,dest.lat,dest.lon);
          }catch(e){}
        }
        // Build up to 2 departure options from the next catchable trains.
        // Each option re-anchors the whole route on its train so transfers
        // and arrival all reflect that departure. Feeds are cached, not refetched.
        // Label: leave-origin time - arrive-destination time (walks included).
        departOptionsCache=[];
        departIdx=0;
        {
          const nowSec=Date.now()/1000;
          const trips=(legResults[0]&&legResults[0].trips)||[];
          const wm=(walkMin!=null?walkMin:0);
          const catchable=trips.filter(tr=>tr.bt-wm*60>=nowSec).slice(0,2);
          for(const tr of catchable){
            const lr=await computeRoute(legs, tr.bt-1);
            const at=lr[0]&&lr[0].trip;
            if(at&&!departOptionsCache.some(o=>Math.abs(o.trainBt-at.bt)<60)){
              const lastTrip=lr[lr.length-1]&&lr[lr.length-1].trip;
              const walkTail=(arrWalkMin!=null?arrWalkMin*60:0);
              let arriveDest=(lastTrip&&lastTrip.at)?lastTrip.at+walkTail:null;
              if(arriveDest==null){
                // Fallback: estimate from main route's train travel duration
                const mainLast=legResults[legResults.length-1]&&legResults[legResults.length-1].trip;
                const mainFirst=legResults[0]&&legResults[0].trip;
                if(mainLast&&mainLast.at&&mainFirst&&mainFirst.bt){
                  const mainDur=mainLast.at-mainFirst.bt;
                  if(mainDur>0) arriveDest=at.bt+mainDur+walkTail;
                }
              }
              const lb=(walkMin!=null?at.bt-walkMin*60:at.bt);
              departOptionsCache.push({leaveBy:lb, trainBt:at.bt, arriveDest:arriveDest, legResults:lr});
            }
          }
          if(departOptionsCache.length){
            // Restore session selection by train time (robust to list shifts)
            try{
              const saved=JSON.parse(sessionStorage.getItem("roam_depart")||"null");
              if(saved&&saved.destIndex===S.destIndex&&saved.dir===S.dir){
                const fi=departOptionsCache.findIndex(o=>Math.abs(o.trainBt-saved.trainBt)<90);
                if(fi>=0) departIdx=fi;
              }
            }catch(e){}
            legResults=departOptionsCache[departIdx].legResults;
          }
        }
        renderRoute(legResults, walkMin, arrWalkMin);
        const alts=hasDisruption(legResults)?await findFastRoutes(legResults):[];
        renderAlts(alts, legResults);
      }
      $("updated").textContent=t("updated",{time:fmtHM()});
    }
  }catch(e){
    showErr(t("err_load")+" ("+String(e.message||e).slice(0,80)+")");
  }
  loading=false;
}

/* ===== searchable station picker ===== */
function makePicker(el, leg, which, showChips){
  el.innerHTML='<input class="f-input" placeholder=""+t("station_ph")+"" autocomplete="off">'+
    '<div class="picker-list"></div>'+(showChips?'<div class="linechips"></div>':"");
  const input=el.querySelector("input"), list=el.querySelector(".picker-list"),
        chips=el.querySelector(".linechips");
  function renderPicked(){
    const st=ST_BY_ID[leg[which]];
    if(document.activeElement!==input) input.value=st?st.name:"";
    if(!chips) return;
    chips.innerHTML="";
    if(st&&st.lines.length>1){
      st.lines.forEach(l=>{
        const b=document.createElement("button");
        b.type="button";
        b.className="chip"+(l===leg.line?" sel":"");
        b.textContent=l;
        b.onclick=()=>{ leg.line=l; saveSettings(); renderPicked(); };
        chips.appendChild(b);
      });
    }
  }
  function filter(){
    const q=input.value.trim().toLowerCase();
    list.innerHTML="";
    if(!q){ list.classList.remove("open"); return; }
    const matches=STATIONS.filter(s=>s.name.toLowerCase().includes(q)).slice(0,40);
    matches.forEach(s=>{
      const d=document.createElement("div");
      d.className="picker-item";
      d.innerHTML=s.lines.map(lineBadge).join("")+"<span>"+esc(s.name)+"</span>";
      d.onclick=()=>{
        leg[which]=s.id;
        if(!s.lines.includes(leg.line)) leg.line=s.lines[0];
        saveSettings();
        input.value=s.name;
        list.classList.remove("open");
        renderPicked();
      };
      list.appendChild(d);
    });
    list.classList.toggle("open", matches.length>0);
  }
  input.addEventListener("input", filter);
  input.addEventListener("focus", ()=>{ input.select(); filter(); });
  document.addEventListener("click", e=>{ if(!el.contains(e.target)){ list.classList.remove("open"); renderPicked(); } });
  renderPicked();
  return { refresh: renderPicked };
}
function fmtAddr(a){
  const ad=a.address||{};
  const num=String(ad.house_number||"").trim();
  const road=String(ad.road||ad.pedestrian||ad.footway||ad.cycleway||"").trim();
  let line1=(num+" "+road).trim();
  if(!line1){
    line1=String(a.display_name||"").split(",").slice(0,2).join(",").trim();
  }
  line1=line1.replace(/^(\d+),\s*/,"$1 ");
  const suburb=String(ad.suburb||ad.neighbourhood||ad.quarter||ad.borough||"").trim();
  const city=String(ad.city||ad.town||ad.village||ad.municipality||"").trim();
  let state=String(ad.state||"").trim();
  const iso=String(ad["ISO3166-2-lvl4"]||"").trim();
  if(/^US-/i.test(iso)) state=iso.slice(3).toUpperCase();
  const zip=String(ad.postcode||"").trim();
  const norm=s=>s.toLowerCase().replace(/[^a-z]/g,"");
  const cityIsState=(()=>{
    if(!city||!state) return false;
    if(norm(city)===norm(state)) return true;
    if(state.length===2){
      const initials=city.toLowerCase().replace(/[^a-z ]/g,"").trim().split(/\s+/).map(w=>w[0]||"").join("");
      return initials===state.toLowerCase();
    }
    return false;
  })();
  const parts=[];
  if(suburb) parts.push(suburb);
  if(city&&norm(city)!==norm(suburb)&&!cityIsState) parts.push(city);
  const stzip=(state+(zip?" "+zip:"")).trim();
  if(stzip) parts.push(stzip);
  const line2=parts.join(", ");
  return {line1:line1,line2:line2,full:line2?line1+", "+line2:line1};
}
function attachAddrAC(inputId, listId){
  const inp=$(inputId), list=document.getElementById(listId);
  let t=null, lastQ="";
  inp.addEventListener("input",()=>{
    inp.dataset.lat=""; inp.dataset.lon="";
    clearTimeout(t);
    const q=inp.value.trim();
    if(q.length<3){list.innerHTML="";return;}
    t=setTimeout(async()=>{
      if(q===lastQ) return; lastQ=q;
      try{
        const url="https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=6&countrycodes=us&viewbox=-74.35,40.45,-73.65,40.95&q="+encodeURIComponent(q);
        const r=await fetch(url,{headers:{"Accept":"application/json"}});
        const arr=await r.json();
        list.innerHTML="";
        arr.forEach(a=>{
          const d=document.createElement("div"); d.className="pick-item";
          const f=fmtAddr(a);
          d.innerHTML="<div><b>"+esc(f.line1)+"</b>"+(f.line2?"<br><span class=pick-line>"+esc(f.line2)+"</span>":"")+"</div>";
          d.onclick=()=>{inp.value=f.full; inp.dataset.lat=a.lat; inp.dataset.lon=a.lon; list.innerHTML="";};
          list.appendChild(d);
        });
      }catch(e){}
    },450);
  });
  document.addEventListener("click",e=>{ if(!list.contains(e.target)&&e.target!==inp) list.innerHTML=""; });
}

      '<div class="f-label" style="margin-top:4px">'+esc(t("walk_time_dest"))+'</div>'+
      '<input class="f-input" id="set-dest-walkd-'+i+'" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="'+esc(t("walk_auto"))+'" value="'+(d.walkDestMin!=null?d.walkDestMin:"")+'" autocomplete="off" style="margin-bottom:4px">'+
      '<div class="f-label" style="margin-top:8px"><span>'+esc(t("route_legs"))+'</span> <span class="f-hint">'+esc(t("legs_hint"))+'</span></div>'+
      '<div id="leg-list-'+i+'"></div>'+
      '<button class="btn block" id="add-leg-'+i+'" type="button">'+esc(t("add_leg"))+'</button>';
    wrap.appendChild(box);

    (function(idx){
      $("add-leg-"+idx).onclick=()=>{
        const dd=S.dests[idx];
        if(!Array.isArray(dd.legs)) dd.legs=[];
        if(dd.legs.length>=4){ showErr(t("max_legs")); return; }
        dd.legs.push({line:"", from:"", to:""});
        saveSettings(); renderLegList(idx);
      };

  }
}
function renderLegList(di){
  const wrap=$("leg-list-"+di);
  if(!wrap) return;
  wrap.innerHTML="";
  const d=S.dests[di]||{};
  (d.legs||[]).forEach((leg,idx)=>{
    const div=document.createElement("div");
    const head=document.createElement("div");
    head.className="row"; head.style.marginTop="8px";
    head.innerHTML='<div class="f-label" style="margin:0">'+esc(t("leg_n",{n:idx+1}))+'</div>';
    const del=document.createElement("button");
    del.className="chip"; del.textContent=t("remove");
    del.onclick=()=>{ d.legs.splice(idx,1); saveSettings(); renderLegList(di); };
    head.appendChild(del);
    div.appendChild(head);
    const fl=document.createElement("div"); fl.className="f-label"; fl.textContent=t("board");
    const fp=document.createElement("div"); fp.className="picker";
    const tl=document.createElement("div"); tl.className="f-label"; tl.textContent=t("get_off");
    const tp=document.createElement("div"); tp.className="picker";
    div.appendChild(fl); div.appendChild(fp); div.appendChild(tl); div.appendChild(tp);
    wrap.appendChild(div);
    makePicker(fp, leg, "from", true);
    makePicker(tp, leg, "to", false);
  });
}

/* select-all on focus for numeric text inputs (iOS Safari: type=number ignores select()) */
function selectAllOnFocus(el){
  const sel=()=>{ try{ el.select(); }catch(e){} };
  el.addEventListener("focus", ()=>{
    // iOS Safari presents the keyboard asynchronously; defer selection
    sel();
    requestAnimationFrame(sel);
    setTimeout(sel, 100);
  });
  // re-tap on an already-focused field should also select all
  el.addEventListener("click", ()=>{ if(document.activeElement===el) sel(); });
}
function initSettings(){
  $("set-home").value=S.home.label||"";
  $("set-home").dataset.lat=S.home.lat||"";
  $("set-home").dataset.lon=S.home.lon||"";
  attachAddrAC("set-home","home-ac");
  applyI18n();
  $("sheet-close").onclick=()=>{ $("sheet").classList.remove("open"); };
  $("settings-btn").onclick=()=>{ tap(); $("sheet").classList.add("open"); };
  $("refresh-btn").onclick=()=>{ tap(); const rb=$("refresh-btn"); rb.classList.add("spinning"); loadAll().finally(()=>rb.classList.remove("spinning")); };
  $("sheet").addEventListener("click",e=>{ if(e.target===$("sheet")) $("sheet").classList.remove("open"); });
  $("set-save").onclick=async ()=>{
    const btn=$("set-save");
    btn.textContent=t("saving");
    btn.disabled=true;
    try{
      const hl=$("set-home").value.trim();
      if(hl&&hl!==S.home.label){
        const hi=$("set-home");
        if(hi.dataset.lat&&hi.dataset.lon) S.home={label:hl,lat:+hi.dataset.lat,lon:+hi.dataset.lon};
        else{ const g=await geocode(hl); if(g) S.home={label:hl,lat:g.lat,lon:g.lon}; else S.home.label=hl; }
      }
      for(let i=0;i<3;i++){
        const nm=$("set-dest-name-"+i).value.trim();
        const al=$("set-dest-"+i).value.trim();
        const prev=S.dests[i]||{};
        let lat=prev.lat||null, lon=prev.lon||null, label=al;
        if(al&&al!==prev.label){
          const ai=$("set-dest-"+i);
          if(ai.dataset.lat&&ai.dataset.lon){ lat=+ai.dataset.lat; lon=+ai.dataset.lon; }
          else{ const g=await geocode(al); if(g){ lat=g.lat; lon=g.lon; } }
        }else if(!al){ lat=null; lon=null; }
        const prevLegs=(S.dests[i]&&S.dests[i].legs)||[];
        let wv=null, wdv=null;
        if(i<2){
          const wi=$("set-dest-walk-"+i);
          if(wi){ const pv=parseInt(wi.value,10); wv=isNaN(pv)?null:Math.min(120,Math.max(1,pv)); }
          const wdi=$("set-dest-walkd-"+i);
          if(wdi){ const pv=parseInt(wdi.value,10); wdv=isNaN(pv)?null:Math.min(120,Math.max(1,pv)); }
        }
        S.dests[i]={name:(i===2?"Search":nm), label:label, lat:lat, lon:lon, legs:prevLegs, walkMin:wv, walkDestMin:wdv};
      }
      saveSettings();
      updateDestToggle();
      $("sheet").classList.remove("open");
      loadAll();
    }catch(e){ showErr(t("err_save")+String(e.message||e).slice(0,80)); }
    btn.textContent=t("save");
    btn.disabled=false;
  };
}
